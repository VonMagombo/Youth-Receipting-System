name: Android APK

on:
  push:
    paths:
      - "mobile/**"
      - "verify/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Held at v5 (MIT, Node 24): v6 moved caching into a closed-source component under Gradle's
      # commercial Terms of Use. Move to v6 only after deciding to accept those terms.
      - uses: gradle/actions/setup-gradle@v5
      # The release key must be the same for every build, or installed phones cannot update
      # without uninstalling (which deletes the app's data). See docs/RELEASE_SIGNING.md.
      - name: Load release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing. Refusing to ship a debug-signed APK. See docs/RELEASE_SIGNING.md."
            exit 1
          fi
          printf %s "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # 64-bit and 32-bit ARM cover practically all Android phones; skipping x86 halves build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/youth-subs-${GITHUB_SHA::7}.apk"
          ls -la dist
      - name: Check the APK is signed with the release key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          GOT=$("$APKSIGNER" verify --print-certs dist/*.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          # keytool is the same Java code Gradle signs with, so it reads every keystore Gradle can,
          # including older RC2-40 ones that OpenSSL 3 refuses. It also picks the alias Gradle used.
          WANT=$(keytool -list -v -storetype pkcs12 -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            | awk '$1 == "SHA256:" {print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK signer SHA-256:  $GOT"
          echo "Release key SHA-256: $WANT"
          if [ -z "$WANT" ]; then
            echo "::error::Could not read the release key. Check ANDROID_KEY_ALIAS and ANDROID_KEYSTORE_PASSWORD (docs/RELEASE_SIGNING.md)."
            exit 1
          fi
          if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
            echo "::error::APK is not signed with the release key (got '$GOT', want '$WANT')."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: youth-subs-apk
          path: mobile/dist/*.apk
          retention-days: 30
